function apply(){canvas.style.transform=`translate(${x}px,${y}px) scale(${s})`;zl.textContent=Math.round(s*100)+'%'}function limit(v){return Math.max(.22,Math.min(1.7,v))}function zoomAt(ns,cx,cy){ns=limit(ns);const wx=(cx-x)/s,wy=(cy-y)/s;x=cx-wx*ns;y=cy-wy*ns;s=ns;apply()}function fit(){const p=20;s=limit(Math.min((viewport.clientWidth-p*2)/1600,(viewport.clientHeight-p*2)/2200));x=(viewport.clientWidth-1600*s)/2;y=(viewport.clientHeight-2200*s)/2;apply()}
viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoomAt(s*(e.deltaY<0?1.12:.89),e.clientX-r.left,e.clientY-r.top)},{passive:false});viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.drawer'))return;drag=true;viewport.classList.add('dragging');px=e.clientX;py=e.clientY;ox=x;oy=y;viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!drag)return;x=ox+e.clientX-px;y=oy+e.clientY-py;apply()});viewport.addEventListener('pointerup',()=>{drag=false;viewport.classList.remove('dragging')});viewport.addEventListener('dblclick',e=>{if(!e.target.closest('.node'))fit()});
document.getElementById('plus').onclick=()=>zoomAt(s*1.18,viewport.clientWidth/2,viewport.clientHeight/2);document.getElementById('minus').onclick=()=>zoomAt(s/1.18,viewport.clientWidth/2,viewport.clientHeight/2);document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{s=.55;x=20;y=10;apply()};
const drawer=document.getElementById('drawer');document.querySelectorAll('.node').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();const d=details[n.dataset.id];if(!d)return;document.getElementById('kicker').textContent=n.dataset.id.toUpperCase()+' · '+(d[3].length?'源码节点':'流程节点');document.getElementById('dt').textContent=d[0];document.getElementById('ds').textContent=d[1];const sourceBlock=d[3].length?`<div class="block"><h4>对应源码</h4>${d[3].map(v=>`<code class="source">${v}</code>`).join('')}</div>`:'';document.getElementById('db').innerHTML=`<div class="block"><h4>内部处理 / 输出</h4><p>${d[2]}</p></div>${sourceBlock}`;drawer.classList.add('open')}));document.getElementById('close').onclick=()=>drawer.classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer.classList.remove('open')});
document.querySelectorAll('.filter button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter button').forEach(v=>v.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;document.querySelectorAll('.stage').forEach(g=>g.classList.toggle('dim',f!=='all'&&g.dataset.stage!==f))});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.node').forEach(n=>{const d=details[n.dataset.id];n.classList.toggle('hit',!!q&&d&&d.join(' ').toLowerCase().includes(q))})});window.addEventListener('resize',fit);setTimeout(fit,40);
})();
</script>
