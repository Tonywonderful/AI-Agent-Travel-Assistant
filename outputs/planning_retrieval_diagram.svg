<text x="82" y="290" font-size="14" fill="#16a34a" font-weight="700">路线1 · 景点</text>
<text x="82" y="310" font-size="12" fill="#1f2937">query = 景点改写 query</text>
<text x="82" y="327" font-size="12" fill="#1f2937">categories=["attraction"]</text>
<text x="82" y="344" font-size="12" fill="#1f2937">top_k=RAG_TOP_K(5)</text>
<text x="82" y="361" font-size="12" fill="#1f2937">retrieval_scope=planning</text>
<rect x="430" y="268" width="320" height="120" rx="10" ry="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
