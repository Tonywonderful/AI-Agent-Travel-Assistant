<text x="684" y="488" font-size="12" fill="#0f172a">Chroma 空时走 _search_guide_chunks_by_keywords</text>
<line x1="860" y1="494" x2="868" y2="494" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
