<text x="96" y="488" font-size="12" fill="#0f172a">rag:guide:&lt;model&gt;:&lt;dest&gt;:&lt;scope&gt;:&lt;cat&gt;:&lt;tier&gt;:&lt;q&gt;:&lt;k&gt;</text>
