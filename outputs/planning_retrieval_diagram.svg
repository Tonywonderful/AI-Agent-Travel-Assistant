<text x="802" y="327" font-size="12" fill="#1f2937">categories=["restaurant"]</text>
<text x="802" y="344" font-size="12" fill="#1f2937">top_k=max(2,min(day*2,30))</text>
<text x="802" y="361" font-size="12" fill="#1f2937">retrieval_scope=planning</text>
