<text x="442" y="310" font-size="12" fill="#1f2937">query = 目的地 住宿 酒店 [档次] [预算] [备注]</text>
<text x="442" y="327" font-size="12" fill="#1f2937">categories=["hotel"]</text>
<text x="442" y="344" font-size="12" fill="#1f2937">top_k=3, budget_tier=规范化档次</text>
<text x="442" y="361" font-size="12" fill="#1f2937">retrieval_scope=planning</text>
<rect x="790" y="268" width="320" height="120" rx="10" ry="10" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
