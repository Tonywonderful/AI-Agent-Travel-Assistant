<text x="84" y="610" font-size="14" fill="#ea580c" font-weight="700">重排序 rerank_guide_chunks (retriever.py:265) — 先取 rerank 缓存</text>
<rect x="84" y="626" width="500" height="96" rx="10" ry="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="96" y="648" font-size="14" fill="#ea580c" font-weight="700">优先 Cross-encoder（OpenRouter）</text>
<text x="96" y="668" font-size="12" fill="#1f2937">模型 nvidia/llama-nemotron-rerank-vl-1b-v2:free</text>
<text x="96" y="685" font-size="12" fill="#1f2937">送入前剔除噪声标题『文档开头』(_NOISE_TITLES)</text>
<text x="96" y="702" font-size="12" fill="#1f2937">top_n = min(top_k, len(documents))，返回分数+原索引</text>
<rect x="610" y="626" width="486" height="96" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="622" y="648" font-size="14" fill="#dc2626" font-weight="700">失败/未配置 → 规则回退 _score_chunk_for_rerank</text>
<text x="622" y="668" font-size="12" fill="#7f1d1d">标题/正文关键词命中 +3/+1</text>
<text x="622" y="685" font-size="12" fill="#7f1d1d">目的地不匹配 -5；文档开头 -8；行程参考/目的地简介降权</text>
<text x="622" y="702" font-size="12" fill="#7f1d1d">注意：生产链路允许规则回退；评估脚本禁止回退</text>
<line x1="334" y1="722" x2="334" y2="740" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70" y="766" width="1040" height="70" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="82" y="788" font-size="14" fill="#7c3aed" font-weight="700">三路结果合并 → rag_contexts</text>
<text x="82" y="808" font-size="12" fill="#0f172a">按文本去重合并；已排除 assistant_only 类 Chunk：文档开头 / 目的地简介 / 第5章预约价格安全 / 交通距离与行程组织 / 专项通用安全</text>
<line x1="590" y1="740" x2="590" y2="766" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70" y="858" width="1040" height="92" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="82" y="880" font-size="14" fill="#16a34a" font-weight="700">回到 generate_trip_itinerary：生成结构化行程</text>
<text x="82" y="900" font-size="12" fill="#1f2937">generate_planner_draft(request, rag_contexts, day_count) 调 LLM 产出 JSON 草稿</text>
<text x="82" y="917" font-size="12" fill="#1f2937">名称硬校验：spot/meal 必须在 rag_contexts 实体中，否则回退攻略候选 → 每日 spot/meal/hotel</text>
