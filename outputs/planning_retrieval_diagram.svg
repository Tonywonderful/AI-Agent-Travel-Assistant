<text x="82" y="190" font-size="14" fill="#ca8a04" font-weight="700">Query 改写 build_destination_query (rag_tool.py:235)</text>
<text x="82" y="210" font-size="12" fill="#1f2937">LLM 改写：只保留景点/活动关键词，剥离酒店/餐厅/菜品/交通（_sanitize_activity_query）</text>
