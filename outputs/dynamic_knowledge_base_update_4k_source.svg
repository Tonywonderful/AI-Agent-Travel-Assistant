<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" width="3840" height="4320" role="img" aria-labelledby="title desc">
  <title id="title">动态更新知识库：逻辑与技术全景</title>
  <desc id="desc">展示本地 Markdown 攻略从周期扫描、内容指纹比较、四类变化分流、知识状态提交、缓存失效到下一次 RAG 查询使用新知识的完整逻辑。</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1800" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1520" height="1720" rx="28" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5"/>
  <text x="90" y="92" fill="#2C2C2A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500">动态更新知识库：逻辑与技术全景</text>
  <text x="90" y="132" fill="#5F5E5A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22">发现变化 → 判断变化 → 更新知识 → 清除旧结果 → 新知识生效</text>

  <rect x="75" y="170" width="1450" height="270" rx="24" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="112" y="217" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500">1. 形成当前知识快照</text>

  <rect x="115" y="258" width="360" height="125" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="295" y="296" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500">本地 Markdown 攻略</text>
  <text x="295" y="330" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">知识内容发生变化</text>
  <text x="295" y="362" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">新增 · 编辑 · 删除</text>

  <path d="M475 321H607" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="615" y="258" width="360" height="125" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="795" y="296" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500">周期扫描</text>
  <text x="795" y="330" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">技术：定时轮询</text>
  <text x="795" y="362" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">读取文件级状态</text>

  <path d="M975 321H1107" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="1115" y="240" width="370" height="161" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1300" y="279" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500">当前文档快照</text>
  <text x="1300" y="315" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">文档 ID · 相对路径</text>
  <text x="1300" y="346" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">修改时间 · 目的地</text>
  <text x="1300" y="377" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">全文内容指纹</text>

  <path d="M800 440V477" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>

  <rect x="75" y="485" width="1450" height="270" rx="24" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="112" y="532" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500">2. 与历史版本比较</text>

  <rect x="115" y="572" width="375" height="128" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="302" y="612" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500">当前内容指纹</text>
  <text x="302" y="648" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">技术：SHA-256</text>
  <text x="302" y="680" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">统一换行后计算</text>

  <path d="M490 636H607" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="615" y="572" width="370" height="128" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="800" y="612" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500">版本对比</text>
  <text x="800" y="648" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">文档 ID 对齐</text>
  <text x="800" y="680" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">内容指纹判变</text>

  <path d="M985 636H1107" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="1115" y="572" width="370" height="128" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1300" y="612" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500">历史文档清单</text>
  <text x="1300" y="648" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">技术：SQLite</text>
  <text x="1300" y="680" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">指纹 · 块数 · 状态</text>

  <text x="115" y="730" fill="#5F5E5A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">文件修改时间只用于记录；是否改变最终由全文内容指纹决定</text>
  <path d="M800 755V792" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>

  <rect x="75" y="800" width="1450" height="435" rx="24" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="112" y="847" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500">3. 四类变化分流</text>

  <rect x="105" y="887" width="330" height="285" rx="18" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="270" y="932" text-anchor="middle" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500">新增</text>
  <text x="270" y="970" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">当前有 · 历史无</text>
  <line x1="145" y1="997" x2="395" y2="997" stroke="#D3D1C7" stroke-width="1"/>
  <text x="270" y="1037" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">按 ## / ### 语义切块</text>
  <text x="270" y="1071" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">生成稳定 Chunk ID</text>
  <text x="270" y="1105" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">Embedding 生成向量</text>
  <text x="270" y="1139" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">写入新知识与版本记录</text>

  <rect x="458" y="887" width="330" height="285" rx="18" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="623" y="932" text-anchor="middle" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500">修改</text>
  <text x="623" y="970" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">两边有 · 指纹不同</text>
  <line x1="498" y1="997" x2="748" y2="997" stroke="#D3D1C7" stroke-width="1"/>
  <text x="623" y="1037" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">删除该文档全部旧块</text>
  <text x="623" y="1071" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">整篇重新切块</text>
  <text x="623" y="1105" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">全部重新向量化</text>
  <text x="623" y="1139" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">文档级增量更新</text>

  <rect x="811" y="887" width="330" height="285" rx="18" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="976" y="932" text-anchor="middle" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500">未变化</text>
  <text x="976" y="970" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">两边有 · 指纹相同</text>
  <line x1="851" y1="997" x2="1101" y2="997" stroke="#D3D1C7" stroke-width="1"/>
  <text x="976" y="1052" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">直接跳过</text>
  <text x="976" y="1090" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">不切块 · 不向量化</text>
  <text x="976" y="1128" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">不写 Chroma</text>

  <rect x="1164" y="887" width="330" height="285" rx="18" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="1329" y="932" text-anchor="middle" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500">删除</text>
  <text x="1329" y="970" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">当前无 · 历史有</text>
  <line x1="1204" y1="997" x2="1454" y2="997" stroke="#D3D1C7" stroke-width="1"/>
  <text x="1329" y="1037" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">按文档 metadata 定位</text>
  <text x="1329" y="1071" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">删除关联向量块</text>
  <text x="1329" y="1105" text-anchor="middle" fill="#444441" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">移除版本记录</text>
  <text x="1329" y="1139" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">可选择跳过删除处理</text>

  <text x="112" y="1208" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">单篇失败会记录错误并继续处理其他文档；只有成功应用的新增、修改或删除才计入变更数</text>
  <path d="M800 1235V1272" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#greenArrow)"/>

  <rect x="75" y="1280" width="1450" height="245" rx="24" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="112" y="1327" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500">4. 提交新知识状态并清除旧结果</text>

  <rect x="115" y="1368" width="350" height="105" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="290" y="1408" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500">向量知识库</text>
  <text x="290" y="1443" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">Chroma · 文本 · metadata</text>
  <path d="M465 1420H607" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>

  <rect x="615" y="1368" width="370" height="105" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="800" y="1408" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500">文档版本清单</text>
  <text x="800" y="1443" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">SQLite · 指纹 · 块数 · 状态</text>
  <path d="M985 1420H1107" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>

  <rect x="1115" y="1368" width="370" height="105" rx="18" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1300" y="1408" text-anchor="middle" fill="#0C447C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500">RAG 旧缓存失效</text>
  <text x="1300" y="1443" text-anchor="middle" fill="#185FA5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19">Redis：检索结果 + 重排结果</text>

  <text x="112" y="1501" fill="#5F5E5A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">仅当至少一项变更成功应用才清缓存；Redis 不可用不会阻止知识库更新</text>
  <path d="M800 1525V1562" fill="none" stroke="#185FA5" stroke-width="3" marker-end="url(#blueArrow)"/>

  <rect x="75" y="1570" width="1450" height="145" rx="24" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="112" y="1615" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500">5. 新知识在下一次查询中生效</text>

  <rect x="112" y="1643" width="1300" height="48" rx="14" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="762" y="1675" text-anchor="middle" fill="#085041" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">缓存未命中 → Query Embedding → 按目的地向量召回 → 语义重排 → Planner 获得新上下文 → 名称真实性回查</text>
  <text x="1418" y="1680" text-anchor="middle" fill="#0F6E56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">新知识生效</text>

  <text x="800" y="1744" text-anchor="middle" fill="#5F5E5A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">当前实现是前台周期扫描，不是操作系统级实时监听；同步进程停止后，自动更新也会停止</text>
</svg>
